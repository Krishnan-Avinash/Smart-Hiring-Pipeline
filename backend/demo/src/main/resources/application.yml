spring:
  application:
    name: smartHiringPipeline
  datasource:
    url: jdbc:postgresql://localhost:5432/shp
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}

gemini:
  api-key: ${GEMINI_API_KEY}
